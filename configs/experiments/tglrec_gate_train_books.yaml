# TGL-Rec Gate Training Config (Books domain)
# Usage: python scripts/train_need_gate.py --config configs/experiments/tglrec_gate_train_books.yaml --output-dir outputs/gate_training/books/

dataset:
  domain: books
  train_interactions: data/domains/books/train_interactions.jsonl
  item_records: data/domains/books/item_records.jsonl
  candidates_dir: data/domains/books/same_candidate/

time_window:
  window_seconds: 604800  # 7 days
  decay_lambda: 0.0000116  # 1/86400

retrieval:
  modes:
    - transition_topk
    - time_window_topk
    - semantic_topk
    - contrastive_transition_only
    - recent_history_focused
  top_k_per_candidate: 3
  recent_history_items: 3

gate:
  input_dim: 25
  use_interaction: true
  learning_rate: 0.01
  l2_reg: 0.001
  max_epochs: 100
  patience: 10
  batch_size: 256

scoring:
  mode: reportable
  trap_penalty_weight: 0.3
  confidence_weight: 0.15
  recency_weight: 0.2

evaluation:
  candidate_protocol: same_candidate
  metrics:
    - MRR
    - HR@5
    - HR@10
    - NDCG@5
    - NDCG@10

experiment:
  run_id: tglrec_gate_train_books
  reportable: true
  evidence_level: formal
  seed: 42

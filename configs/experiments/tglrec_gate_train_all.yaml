# TGL-Rec Gate Training Config (All 4 domains)
# Usage: python scripts/train_need_gate.py --config configs/experiments/tglrec_gate_train_all.yaml --output-dir outputs/gate_training/all_domains/

dataset:
  domains:
    - domain: beauty
      train_interactions: data/domains/beauty/train_interactions.jsonl
      item_records: data/domains/beauty/item_records.jsonl
      candidates_dir: data/domains/beauty/same_candidate/
    - domain: books
      train_interactions: data/domains/books/train_interactions.jsonl
      item_records: data/domains/books/item_records.jsonl
      candidates_dir: data/domains/books/same_candidate/
    - domain: electronics
      train_interactions: data/domains/electronics/train_interactions.jsonl
      item_records: data/domains/electronics/item_records.jsonl
      candidates_dir: data/domains/electronics/same_candidate/
    - domain: movies
      train_interactions: data/domains/movies/train_interactions.jsonl
      item_records: data/domains/movies/item_records.jsonl
      candidates_dir: data/domains/movies/same_candidate/

time_window:
  window_seconds: 604800  # 7 days
  decay_lambda: 0.0000116  # 1/86400

retrieval:
  modes:
    - transition_topk
    - time_window_topk
    - semantic_topk
    - contrastive_transition_only
    - recent_history_focused
  top_k_per_candidate: 3
  recent_history_items: 3

gate:
  input_dim: 25
  use_interaction: true
  learning_rate: 0.01
  l2_reg: 0.001
  max_epochs: 200
  patience: 15
  batch_size: 512

scoring:
  mode: reportable
  trap_penalty_weight: 0.3
  confidence_weight: 0.15
  recency_weight: 0.2

evaluation:
  candidate_protocol: same_candidate
  metrics:
    - MRR
    - HR@5
    - HR@10
    - NDCG@5
    - NDCG@10

experiment:
  run_id: tglrec_gate_train_all_domains
  reportable: true
  evidence_level: formal
  seeds: [42, 2026, 2027, 2028, 2029]
